<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Free Games Auto-Claimer</title>
<style>
  /* Memes jetons que le popup et le journal. */
  :root {
    --ink: #14101F; --ink-2: #1E1830; --ink-3: #262038; --line: #2E2745;
    --rail: #0E0A18; --amber-d: #FF8A3D; color-scheme: dark;
    --paper: #EDE9F5; --mute: #9A90B8; --amber: #FFB454; --jade: #56D6A0; --rose: #FF6B81;
    --display: "Bahnschrift", "DIN Alternate", "Segoe UI Semibold", "Segoe UI", system-ui, sans-serif;
    --body: "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: "Cascadia Mono", "Consolas", ui-monospace, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --ink: #FBFAFE; --ink-2: #F2EFF9; --ink-3: #E8E3F3; --line: #DCD5EC;
      --rail: #E2DCEF; --amber-d: #A85400; color-scheme: light;
      --paper: #1B1528; --mute: #6E6488; --amber: #B96A00; --jade: #12805B; --rose: #D62B47;
    }
  }
  :root[data-theme="light"] {
    --ink: #FBFAFE; --ink-2: #F2EFF9; --ink-3: #E8E3F3; --line: #DCD5EC;
    --rail: #E2DCEF; --amber-d: #A85400; color-scheme: light;
    --paper: #1B1528; --mute: #6E6488; --amber: #B96A00; --jade: #12805B; --rose: #D62B47;
  }

  * { box-sizing: border-box; }

  /* ------------------------------------------------- barre de defilement
     Le pouce EST un ticket : le degrade ambre de icon.svg, des coins
     pleinement arrondis, et la ligne de perforation en pointilles qui le
     traverse dans sa longueur (l'icone la dessine en `stroke-dasharray`).
     La piste est le creux ou le ticket coulisse -- `--rail`, deja le token
     de tous les creux du produit.

     La couleur de la perforation est tiree de `--ink`, et c'est le tour de
     force du truc : `--ink` bascule avec le theme, donc la perforation
     bascule avec lui, dans le bon sens et sans une ligne de plus. Sombre
     sur ambre vif ; claire sur ambre brule.

     Pas de transition : Chrome n'anime pas les pseudo-elements de
     scrollbar. Le survol est un basculement net, et c'est assume. */

  ::-webkit-scrollbar { width: 12px; height: 12px; }

  ::-webkit-scrollbar-track { background: var(--rail); }
  ::-webkit-scrollbar-corner { background: var(--rail); }
  ::-webkit-scrollbar-button { display: none; }

  ::-webkit-scrollbar-thumb {
    /* Bordure transparente + content-box : une gouttiere de 2px, pour que le
       ticket ne touche jamais les bords de son rail. */
    border: 2px solid transparent;
    background-clip: content-box;
    border-radius: 999px;
    /* En dessous, la perforation n'aurait pas la place d'exister. */
    min-height: 36px;
    background-color: var(--amber-d);
    background-image:
      repeating-linear-gradient(180deg,
        color-mix(in srgb, var(--ink) 62%, transparent) 0 5px,
        transparent 5px 9px),
      linear-gradient(180deg, var(--amber), var(--amber-d));
    background-repeat: repeat-y, no-repeat;
    background-size: 2px 9px, auto;
    background-position: center top, 0 0;
  }

  ::-webkit-scrollbar-thumb:hover {
    background-image:
      repeating-linear-gradient(180deg,
        color-mix(in srgb, var(--ink) 72%, transparent) 0 5px,
        transparent 5px 9px),
      linear-gradient(180deg,
        color-mix(in srgb, var(--amber) 82%, white), var(--amber));
  }

  ::-webkit-scrollbar-thumb:active {
    background-image:
      repeating-linear-gradient(180deg,
        color-mix(in srgb, var(--ink) 80%, transparent) 0 5px,
        transparent 5px 9px),
      linear-gradient(180deg, var(--amber-d), var(--amber-d));
  }

  /* Le ticket couche : la perforation tourne avec lui. */
  ::-webkit-scrollbar-thumb:horizontal {
    min-height: 0;
    min-width: 36px;
    background-image:
      repeating-linear-gradient(90deg,
        color-mix(in srgb, var(--ink) 62%, transparent) 0 5px,
        transparent 5px 9px),
      linear-gradient(90deg, var(--amber), var(--amber-d));
    background-repeat: repeat-x, no-repeat;
    background-size: 9px 2px, auto;
    background-position: left center, 0 0;
  }

  /* Firefox n'a pas ces pseudo-elements : il recoit la version plate. Chrome,
     lui, comprend `selector(::-webkit-scrollbar)`, donc ce bloc ne s'y
     applique pas -- et surtout : poser `scrollbar-width` ou `scrollbar-color`
     sur un element fait IGNORER a Chromium (121+) tous ses
     `::-webkit-scrollbar-*`. Ces deux proprietes doivent donc rester hors de
     sa portee, sans quoi rien de ce qui precede ne s'affiche. */
  @supports not selector(::-webkit-scrollbar) {
    :root { scrollbar-width: thin; scrollbar-color: var(--amber-d) var(--rail); }
  }
  [hidden] { display: none !important; }

  body {
    margin: 0; padding: 24px 20px 40px;
    background: var(--ink); color: var(--paper); font: 13px/1.55 var(--body);
  }
  .wrap { max-width: 820px; margin: 0 auto; }

  h1 { font: 600 19px/1.2 var(--display); margin: 0 0 4px; letter-spacing: .02em; }
  .sub { color: var(--mute); margin: 0 0 20px; max-width: 72ch; }

  /* L'etat, en tete : on doit savoir en un coup d'oeil si le repli travaille. */
  .state {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 12px 14px; border-radius: 9px; margin-bottom: 16px;
    border: 1px solid var(--amber);
    background: color-mix(in srgb, var(--amber) 10%, transparent);
  }
  .state.ok { border-color: var(--jade); background: color-mix(in srgb, var(--jade) 12%, transparent); }
  .state .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--amber); flex: none; }
  .state.ok .dot { background: var(--jade); }
  .state b { font-weight: 600; }
  .state .grow { flex: 1 1 auto; }

  button {
    font: inherit; color: var(--paper); background: var(--ink-3);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--amber); }
  button:disabled { opacity: .5; cursor: default; }

  h2 {
    font: 600 10px/1 var(--display); letter-spacing: .16em; text-transform: uppercase;
    color: var(--mute); margin: 24px 0 10px;
  }

  .card { border: 1px solid var(--line); border-radius: 9px; padding: 12px 14px; margin-bottom: 8px; background: var(--ink-2); }
  .card .name { font-weight: 600; }
  .card .count { color: var(--amber); margin-left: 6px; font-size: 12px; }
  .card.back .count { color: var(--jade); }
  .card .why { font-family: var(--mono); font-size: 11.5px; color: var(--paper); margin: 6px 0 0; word-break: break-word; }
  .card .when { color: var(--mute); font-size: 11.5px; margin: 4px 0 0; }

  table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 11.5px; }
  td { padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.when { white-space: nowrap; color: var(--mute); width: 1%; }
  td.level { width: 1%; text-transform: uppercase; font-size: 10.5px; }
  tr.warn td.level { color: var(--amber); }
  tr.error td.level { color: var(--rose); }
  tr.info td.level { color: var(--jade); }

  .note { color: var(--mute); font-size: 11.5px; margin-top: 20px; max-width: 72ch; }
</style>
<link rel="stylesheet" href="brut.css">
</head>
<body>
  <div class="wrap">
    <h1 data-i18n="sentinelTitle"></h1>
    <p class="sub" data-i18n="sentinelSub"></p>

    <div class="state" id="state">
      <span class="dot"></span>
      <span class="grow" id="state-text"></span>
      <button id="try" data-i18n="sentinelTryNow"></button>
      <button id="close" data-i18n="sentinelClose"></button>
    </div>

    <h2 data-i18n="sentinelWhy"></h2>
    <div id="sources"></div>

    <h2 data-i18n="sentinelJournal"></h2>
    <table><tbody id="rows"></tbody></table>

    <p class="note" data-i18n="sentinelNote"></p>
  </div>

  <script src="sentinel.js" type="module"></script>
</body>
</html>
