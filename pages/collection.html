<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free Games Auto-Claimer</title>
<style>
  /* Memes jetons que popup.html et journal.html. Le sombre est la base, le
     clair une surcharge -- « systeme » retire la surcharge et laisse la media
     query gagner. */
  :root {
    --ink:    #14101F;
    --ink-2:  #1E1830;
    --ink-3:  #262038;
    --line:   #2E2745;
    --rail:   #0E0A18;
    --paper:  #EDE9F5;
    --mute:   #9A90B8;
    --amber:  #FFB454;
    --amber-d:#FF8A3D;
    --jade:   #56D6A0;
    --rose:   #FF6B81;
    color-scheme: dark;

    --display: "Bahnschrift", "DIN Alternate", "Segoe UI Semibold", "Segoe UI", system-ui, sans-serif;
    --body:    "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono:    "Cascadia Mono", "Consolas", ui-monospace, monospace;
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --ink:    #FBFAFE;
      --ink-2:  #F2EFF9;
      --ink-3:  #E8E3F3;
      --line:   #DCD5EC;
      --rail:   #E2DCEF;
      --paper:  #1B1528;
      --mute:   #6E6488;
      --amber:  #B96A00;
      --amber-d:#A85400;
      --jade:   #12805B;
      --rose:   #D62B47;
      color-scheme: light;
    }
  }

  :root[data-theme="light"] {
    --ink:    #FBFAFE;
    --ink-2:  #F2EFF9;
    --ink-3:  #E8E3F3;
    --line:   #DCD5EC;
    --rail:   #E2DCEF;
    --paper:  #1B1528;
    --mute:   #6E6488;
    --amber:  #B96A00;
    --amber-d:#A85400;
    --jade:   #12805B;
    --rose:   #D62B47;
    color-scheme: light;
  }

  * { box-sizing: border-box; }

  /* ------------------------------------------------- barre de defilement
     Le pouce EST un ticket : le degrade ambre de icon.svg, des coins
     pleinement arrondis, et la ligne de perforation en pointilles qui le
     traverse dans sa longueur (l'icone la dessine en `stroke-dasharray`).
     La piste est le creux ou le ticket coulisse -- `--rail`, deja le token
     de tous les creux du produit.

     La couleur de la perforation est tiree de `--ink`, et c'est le tour de
     force du truc : `--ink` bascule avec le theme, donc la perforation
     bascule avec lui, dans le bon sens et sans une ligne de plus. Sombre
     sur ambre vif ; claire sur ambre brule.

     Pas de transition : Chrome n'anime pas les pseudo-elements de
     scrollbar. Le survol est un basculement net, et c'est assume. */

  ::-webkit-scrollbar { width: 12px; height: 12px; }

  ::-webkit-scrollbar-track { background: var(--rail); }
  ::-webkit-scrollbar-corner { background: var(--rail); }
  ::-webkit-scrollbar-button { display: none; }

  ::-webkit-scrollbar-thumb {
    /* Bordure transparente + content-box : une gouttiere de 2px, pour que le
       ticket ne touche jamais les bords de son rail. */
    border: 2px solid transparent;
    background-clip: content-box;
    border-radius: 999px;
    /* En dessous, la perforation n'aurait pas la place d'exister. */
    min-height: 36px;
    background-color: var(--amber-d);
    background-image:
      repeating-linear-gradient(180deg,
        color-mix(in srgb, var(--ink) 62%, transparent) 0 5px,
        transparent 5px 9px),
      linear-gradient(180deg, var(--amber), var(--amber-d));
    background-repeat: repeat-y, no-repeat;
    background-size: 2px 9px, auto;
    background-position: center top, 0 0;
  }

  ::-webkit-scrollbar-thumb:hover {
    background-image:
      repeating-linear-gradient(180deg,
        color-mix(in srgb, var(--ink) 72%, transparent) 0 5px,
        transparent 5px 9px),
      linear-gradient(180deg,
        color-mix(in srgb, var(--amber) 82%, white), var(--amber));
  }

  ::-webkit-scrollbar-thumb:active {
    background-image:
      repeating-linear-gradient(180deg,
        color-mix(in srgb, var(--ink) 80%, transparent) 0 5px,
        transparent 5px 9px),
      linear-gradient(180deg, var(--amber-d), var(--amber-d));
  }

  /* Le ticket couche : la perforation tourne avec lui. */
  ::-webkit-scrollbar-thumb:horizontal {
    min-height: 0;
    min-width: 36px;
    background-image:
      repeating-linear-gradient(90deg,
        color-mix(in srgb, var(--ink) 62%, transparent) 0 5px,
        transparent 5px 9px),
      linear-gradient(90deg, var(--amber), var(--amber-d));
    background-repeat: repeat-x, no-repeat;
    background-size: 9px 2px, auto;
    background-position: left center, 0 0;
  }

  /* Firefox n'a pas ces pseudo-elements : il recoit la version plate. Chrome,
     lui, comprend `selector(::-webkit-scrollbar)`, donc ce bloc ne s'y
     applique pas -- et surtout : poser `scrollbar-width` ou `scrollbar-color`
     sur un element fait IGNORER a Chromium (121+) tous ses
     `::-webkit-scrollbar-*`. Ces deux proprietes doivent donc rester hors de
     sa portee, sans quoi rien de ce qui precede ne s'affiche. */
  @supports not selector(::-webkit-scrollbar) {
    :root { scrollbar-width: thin; scrollbar-color: var(--amber-d) var(--rail); }
  }

  body {
    margin: 0;
    padding: 24px 16px 40px;
    background: var(--ink);
    color: var(--paper);
    font: 13px/1.5 var(--body);
  }

  .wrap { max-width: 1040px; margin: 0 auto; }

  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  h1 { font: 600 19px/1.2 var(--display); margin: 0; letter-spacing: .02em; }
  .sub { color: var(--mute); font-size: 12px; margin: 0 0 18px; max-width: 76ch; }

  .counts { display: flex; gap: 16px; margin-left: auto; font-size: 12px; flex-wrap: wrap; color: var(--mute); }
  .counts b { font: 600 15px/1 var(--display); color: var(--paper); margin-left: 4px; }
  .counts .dup b { color: var(--amber); }
  .counts .claimed b { color: var(--jade); }

  /* ------------------------------------------------------ les magasins */
  /* « cards », pas « stores » : la cellule du tableau porte deja ce nom-la,
     et une grille appliquee a une cellule empile ses pastilles. */
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 10px;
    margin-bottom: 16px;
  }
  .card {
    background: var(--ink-2); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0;
  }
  .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .card h2 { font: 600 14px/1.2 var(--display); margin: 0; letter-spacing: .02em; }
  .card-count { font: 600 18px/1 var(--display); }
  .card-count.zero { color: var(--mute); }
  .state { margin: 0; font-size: 12px; color: var(--mute); flex: 1 1 auto; }
  .state.ok { color: var(--jade); }
  .state.warn { color: var(--amber); }
  .state.err { color: var(--rose); }
  .state.run { color: var(--paper); }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

  /* ------------------------------------------------------ la barre */
  .bar {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    padding: 10px; margin-bottom: 14px;
    background: var(--ink-2); border: 1px solid var(--line); border-radius: 8px;
  }

  input[type="search"], select, button {
    font: inherit; color: var(--paper);
    background: var(--ink-3); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 10px;
  }
  input[type="search"] { flex: 1 1 200px; min-width: 150px; }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--amber); }
  button:disabled { opacity: .55; cursor: default; }
  button.primary { border-color: var(--amber); color: var(--amber); font-weight: 600; }
  button.ghost { background: transparent; color: var(--mute); }
  /* « Se connecter » ouvre le magasin : un lien, habille comme les boutons
     voisins (2.60.0) -- un texte souligne se perdait a cote d'eux. */
  a.link {
    display: inline-flex; align-items: center;
    padding: 6px 10px; border: 1px solid var(--amber); border-radius: 6px;
    color: var(--amber); text-decoration: none; font-weight: 600;
  }
  a.link:hover { background: color-mix(in srgb, var(--amber) 12%, transparent); }
  label.check { display: inline-flex; gap: 6px; align-items: center; color: var(--mute); cursor: pointer; }
  .spacer { flex: 1 1 auto; }

  /* ------------------------------------------------------ la liste */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left; font: 600 11px/1 var(--body); text-transform: uppercase;
    letter-spacing: .06em; color: var(--mute);
    padding: 0 10px 8px; border-bottom: 1px solid var(--line);
  }
  td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:hover td { background: var(--ink-2); }

  td.title { word-break: break-word; }
  td.title .untitled { color: var(--mute); font-style: italic; }
  .tag { display: inline-block; margin-left: 8px; font-size: 11px; color: var(--jade); white-space: nowrap; }
  .tag.deck { color: var(--mute); }
  .tag.deck.verified { color: var(--jade); }
  td.stores { white-space: nowrap; width: 1%; }
  td.since { white-space: nowrap; width: 1%; color: var(--mute); font-family: var(--mono); font-size: 12px; }

  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    margin: 1px 4px 1px 0; padding: 1px 8px;
    border: 1px solid var(--line); border-radius: 999px;
    background: var(--ink-3); font-size: 11px;
  }
  .badge a, .badge span { color: var(--paper); text-decoration: none; }
  .badge a:hover { color: var(--amber); }
  .badge a.launch { color: var(--amber); font-size: 10px; }

  /* Etroit : les pastilles passent a la ligne plutot que de pousser la date
     hors de l'ecran. */
  @media (max-width: 600px) {
    td { padding: 7px 6px; }
    td.stores { white-space: normal; width: auto; }
    td.since { font-size: 11px; }
  }

  .empty { color: var(--mute); padding: 28px 10px; text-align: center; }
  .note { color: var(--mute); font-size: 11px; margin-top: 16px; max-width: 76ch; }
  .flash { color: var(--amber); font-size: 12px; min-height: 1.5em; margin: 0 0 8px; }
</style>
<link rel="stylesheet" href="brut.css">
</head>
<body>
  <div class="wrap">
    <header>
      <h1 data-i18n="collectionTitle"></h1>
      <div class="counts">
        <span><span data-i18n="collectionTitles"></span><b id="count-titles">0</b></span>
        <span class="dup"><span data-i18n="collectionDuplicates"></span><b id="count-duplicates">0</b></span>
        <span class="claimed"><span data-i18n="collectionClaimed"></span><b id="count-claimed">0</b></span>
      </div>
    </header>
    <p class="sub" data-i18n="collectionSub"></p>

    <div class="cards" id="stores"></div>

    <p class="flash" id="flash" role="status"></p>

    <div class="bar">
      <input type="search" id="search" data-i18n-attr="placeholder:collectionSearch,aria-label:collectionSearch">
      <select id="store" data-i18n-attr="aria-label:collectionColStores">
        <option value="" data-i18n="collectionAllStores"></option>
      </select>
      <select id="kind" data-i18n-attr="aria-label:collectionKindLabel">
        <option value="game" data-i18n="collectionKindGames"></option>
        <option value="dlc" data-i18n="collectionKindDlc"></option>
        <option value="all" data-i18n="collectionKindAll"></option>
      </select>
      <select id="sort" data-i18n-attr="aria-label:collectionSortLabel">
        <option value="title" data-i18n="collectionSortTitle"></option>
        <option value="since" data-i18n="collectionSortSince"></option>
        <option value="stores" data-i18n="collectionSortStores"></option>
      </select>
      <select id="status" data-i18n-attr="aria-label:backlogFilterLabel">
        <option value="" data-i18n="backlogAll"></option>
        <option value="toTry" data-i18n="backlogToTry"></option>
        <option value="playing" data-i18n="backlogPlaying"></option>
        <option value="done" data-i18n="backlogDone"></option>
        <option value="dropped" data-i18n="backlogDropped"></option>
        <option value="notForMe" data-i18n="backlogNotForMe"></option>
        <option value="none" data-i18n="backlogUntouched"></option>
      </select>
      <select id="deck" data-i18n-attr="aria-label:deckFilterLabel">
        <option value="" data-i18n="deckFilterAll"></option>
        <option value="playable" data-i18n="deckFilterPlayable"></option>
        <option value="verified" data-i18n="deckFilterVerified"></option>
      </select>
      <label class="check"><input type="checkbox" id="duplicates"> <span data-i18n="collectionDuplicatesOnly"></span></label>
      <button id="surprise" data-i18n="backlogSurprise"></button>
      <button id="playtime" data-i18n="mirrorRead"></button>
      <button id="bridge" data-i18n="bridgeSend"></button>
      <span class="spacer"></span>
      <button id="import-all" class="primary" data-i18n="collectionImportAll"></button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th data-i18n="collectionColTitle"></th>
            <th data-i18n="collectionColStores"></th>
            <th data-i18n="collectionColSince"></th>
            <th data-i18n="backlogColStatus"></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <p class="empty" id="empty" hidden></p>
    <p class="sub" id="mirror"></p>
    <p class="note" data-i18n="collectionNote"></p>
  </div>

  <script src="collection.js" type="module"></script>
</body>
</html>
