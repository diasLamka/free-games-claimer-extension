<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Free Games Auto-Claimer</title>
<style>
  /* Dark is the product's own look, so it is the base. Light is an override,
     and "system" simply removes the override and lets the media query win. */
  :root {
    --ink:    #14101F;
    --ink-2:  #1E1830;
    --ink-3:  #262038;
    --line:   #2E2745;
    --rail:   #0E0A18;
    --paper:  #EDE9F5;
    --mute:   #9A90B8;
    --amber:  #FFB454;
    --amber-d:#FF8A3D;
    --jade:   #56D6A0;
    --rose:   #FF6B81;
    /* La couleur des batons du Bilan (2.72.0), validee contre le fond : un
       ambre plus sourd que --amber, qui sortait de la bande de clarte. */
    --chart:  #CC7A20;

    --epic:   #E4DDF5;
    --gog:    #A567FF;
    --steam:  #66C0F4;
    --amazon: #00C2FF;

    --display: "Bahnschrift", "DIN Alternate", "Segoe UI Semibold", "Segoe UI", system-ui, sans-serif;
    --body:    "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono:    "Cascadia Mono", "Consolas", ui-monospace, monospace;

    --pad: 14px;
    --gap: 8px;

    /* Les controles natifs (select, textarea, la scrollbar de repli) suivent
       le theme du produit au lieu d'arriver en blanc sur fond violet. */
    color-scheme: dark;
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --ink:    #FBFAFE;
      --ink-2:  #F2EFF9;
      --ink-3:  #E8E3F3;
      --line:   #DCD5EC;
      --rail:   #E2DCEF;
      --paper:  #1B1528;
      --mute:   #6E6488;
      --amber:  #B96A00;
      --amber-d:#A85400;
      --chart:  #B96A00;
      --jade:   #12805B;
      --rose:   #D62B47;
      --epic:   #3D3459;
      --gog:    #7A32E0;
      --steam:  #1B7FB8;
      --amazon: #0079A8;
      color-scheme: light;
    }
  }

  :root[data-theme="light"] {
    --ink:    #FBFAFE;
    --ink-2:  #F2EFF9;
    --ink-3:  #E8E3F3;
    --line:   #DCD5EC;
    --rail:   #E2DCEF;
    --paper:  #1B1528;
    --mute:   #6E6488;
    --amber:  #B96A00;
    --amber-d:#A85400;
    --chart:  #B96A00;
    --jade:   #12805B;
    --rose:   #D62B47;
    --epic:   #3D3459;
    --gog:    #7A32E0;
    --steam:  #1B7FB8;
    --amazon: #0079A8;
    color-scheme: light;
  }

  /* La densite compacte resserre les deux mesures dont tout le reste depend.
     Elle a longtemps ete une regle MORTE : `popup.js` enregistrait bien un
     reglage `density`, mais rien ne posait jamais `data-density` et aucun
     controle ne permettait d'en changer. Une preference que personne ne
     pouvait modifier, et une regle qui ne s'appliquait jamais. */
  body[data-density="compact"] { --pad: 10px; --gap: 5px; }

  * { box-sizing: border-box; }

  /* Tout element porteur de `hidden` doit disparaitre, meme si sa classe lui
     donne un display. Sans cette regle, `.undo { display: flex }` gagne contre
     l'attribut, et la barre « Annuler » restait visible en permanence -- pour
     une action que personne n'avait faite. */
  [hidden] { display: none !important; }

  html, body {
    margin: 0;
    width: 328px;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--body);
    font-size: 13px;
  }

  body {
    max-height: 560px;
    overflow-y: auto;
    /* Nothing in this popup is meant to scroll sideways. When something
       overflows it is a layout bug, and hiding it keeps the bug from also
       stealing a scrollbar's width from every row. */
    overflow-x: hidden;
  }

  /* ------------------------------------------------- barre de defilement
     Le pouce EST un ticket : le degrade ambre de icon.svg, des coins
     pleinement arrondis, et la ligne de perforation en pointilles qui le
     traverse dans sa longueur (l'icone la dessine en `stroke-dasharray`).
     La piste est le creux ou le ticket coulisse -- `--rail`, deja le token
     de tous les creux du produit.

     La couleur de la perforation est tiree de `--ink`, et c'est le tour de
     force du truc : `--ink` bascule avec le theme, donc la perforation
     bascule avec lui, dans le bon sens et sans une ligne de plus. Sombre
     sur ambre vif ; claire sur ambre brule.

     Pas de transition : Chrome n'anime pas les pseudo-elements de
     scrollbar. Le survol est un basculement net, et c'est assume. */

  ::-webkit-scrollbar { width: 12px; height: 12px; }

  ::-webkit-scrollbar-track { background: var(--rail); }
  ::-webkit-scrollbar-corner { background: var(--rail); }
  ::-webkit-scrollbar-button { display: none; }

  ::-webkit-scrollbar-thumb {
    /* Bordure transparente + content-box : une gouttiere de 2px, pour que le
       ticket ne touche jamais les bords de son rail. */
    border: 2px solid transparent;
    background-clip: content-box;
    border-radius: 999px;
    /* En dessous, la perforation n'aurait pas la place d'exister. */
    min-height: 36px;
    background-color: var(--amber-d);
    background-image:
      repeating-linear-gradient(180deg,
        color-mix(in srgb, var(--ink) 62%, transparent) 0 5px,
        transparent 5px 9px),
      linear-gradient(180deg, var(--amber), var(--amber-d));
    background-repeat: repeat-y, no-repeat;
    background-size: 2px 9px, auto;
    background-position: center top, 0 0;
  }

  ::-webkit-scrollbar-thumb:hover {
    background-image:
      repeating-linear-gradient(180deg,
        color-mix(in srgb, var(--ink) 72%, transparent) 0 5px,
        transparent 5px 9px),
      linear-gradient(180deg,
        color-mix(in srgb, var(--amber) 82%, white), var(--amber));
  }

  ::-webkit-scrollbar-thumb:active {
    background-image:
      repeating-linear-gradient(180deg,
        color-mix(in srgb, var(--ink) 80%, transparent) 0 5px,
        transparent 5px 9px),
      linear-gradient(180deg, var(--amber-d), var(--amber-d));
  }

  /* Le ticket couche : la perforation tourne avec lui. */
  ::-webkit-scrollbar-thumb:horizontal {
    min-height: 0;
    min-width: 36px;
    background-image:
      repeating-linear-gradient(90deg,
        color-mix(in srgb, var(--ink) 62%, transparent) 0 5px,
        transparent 5px 9px),
      linear-gradient(90deg, var(--amber), var(--amber-d));
    background-repeat: repeat-x, no-repeat;
    background-size: 9px 2px, auto;
    background-position: left center, 0 0;
  }

  /* Firefox n'a pas ces pseudo-elements : il recoit la version plate. Chrome,
     lui, comprend `selector(::-webkit-scrollbar)`, donc ce bloc ne s'y
     applique pas -- et surtout : poser `scrollbar-width` ou `scrollbar-color`
     sur un element fait IGNORER a Chromium (121+) tous ses
     `::-webkit-scrollbar-*`. Ces deux proprietes doivent donc rester hors de
     sa portee, sans quoi rien de ce qui precede ne s'affiche. */
  @supports not selector(::-webkit-scrollbar) {
    :root { scrollbar-width: thin; scrollbar-color: var(--amber-d) var(--rail); }
  }

  /* ------------------------------------------------------------- header */
  header {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 12px var(--pad) 10px;
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    background: var(--ink);
    z-index: 3;
  }

  header img { width: 22px; height: 22px; border-radius: 6px; }

  .wordmark {
    font-family: var(--display);
    font-size: 15px;
    letter-spacing: .07em;
    text-transform: uppercase;
    line-height: 1;
  }

  .version { margin-left: auto; color: var(--mute); font-size: 11px; font-variant-numeric: tabular-nums; }

  /* Un bouton sans texte : l'icone dit « en grand », le title le dit en mots. */
  .icon-button {
    display: grid;
    place-items: center;
    width: 24px;
    height: 24px;
    padding: 0;
    margin-right: -4px;
    background: none;
    border-color: transparent;
    color: var(--mute);
  }
  .icon-button:hover { color: var(--amber); border-color: var(--line); }

  /* ------------------------------------------------------------ sections */
  section { padding: var(--pad); border-bottom: 1px solid var(--line); }
  section:last-of-type { border-bottom: 0; }

  h2 {
    margin: 0 0 10px;
    font-family: var(--display);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--mute);
    display: flex;
    align-items: baseline;
    gap: 7px;
  }

  h2 .count { color: var(--amber); font-variant-numeric: tabular-nums; }

  p { margin: 0; }
  .empty { color: var(--mute); font-size: 12px; line-height: 1.5; }
  .hint { color: var(--mute); font-size: 11px; line-height: 1.5; display: block; }
  .ko { color: var(--rose); }
  .ok { color: var(--jade); }
  .wait { color: var(--amber); }

  /* Arret d'urgence actif : impossible a manquer, et impossible a confondre
     avec un etat normal. C'est le seul endroit du popup ou le rouge remplit
     une bande entiere. */
  .stopped {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px var(--pad);
    background: color-mix(in srgb, var(--rose) 16%, transparent);
    border-bottom: 1px solid var(--rose);
    color: var(--rose);
    font-size: 12px;
    font-weight: 600;
  }
  .stopped button { margin-left: auto; font-weight: 400; }

  /* ------------------------------------------------------------- canari */
  /* Le seul bloc du popup qui parle d'une panne du MAGASIN, par opposition a
     une panne de l'extension : ambre, comme les alertes, jamais rouge -- le
     rouge est reserve a l'arret d'urgence. */
  .canary {
    border: 1px solid var(--amber);
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 10px;
    background: color-mix(in srgb, var(--amber) 10%, transparent);
  }
  /* L'avertissement Steam : meme code que le canari -- ambre, jamais rouge. Il
     s'ouvre a la place de l'interrupteur, et c'est lui seul qui l'active. */
  .risk {
    border: 1px solid var(--amber);
    border-radius: 8px;
    padding: 8px 10px;
    margin: 2px 0 10px;
    background: color-mix(in srgb, var(--amber) 10%, transparent);
    font-size: 12px;
  }
  .risk p { margin: 0 0 8px; }
  .risk-actions { display: flex; gap: 8px; align-items: center; }
  .canary-head { display: flex; align-items: baseline; gap: 7px; }
  .canary-store { font-weight: 600; }
  .canary-count { color: var(--amber); font-size: 11px; }
  .canary-head .btn-sm { margin-left: auto; }
  /* Les libelles proposes : des puces, une par bouton vu sur la page. */
  .canary .btn-sm.choice { margin: 0 6px 6px 0; }
  .canary .hint .btn-sm { margin-left: 4px; vertical-align: baseline; }
  .canary-why {
    font-family: var(--mono);
    font-size: 11px;
    margin: 5px 0 4px;
    word-break: break-word;
    color: var(--paper);
  }

  /* --------------------------------------------------- status + progress */
  .status {
    padding: 8px var(--pad);
    font-size: 11.5px;
    color: var(--mute);
    border-bottom: 1px solid var(--line);
  }
  .status b { color: var(--paper); font-weight: 600; }

  /* Not a spinner: the same fuse that runs along a card, but travelling. */
  .working {
    height: 2px;
    background: var(--rail);
    overflow: hidden;
    position: relative;
  }
  .working[hidden] { display: none; }
  .working::after {
    content: "";
    position: absolute;
    inset: 0;
    width: 38%;
    border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--amber), transparent);
    animation: fuse-run 1.05s cubic-bezier(.55, .1, .45, .9) infinite;
  }
  @keyframes fuse-run {
    from { transform: translateX(-100%); }
    to   { transform: translateX(300%); }
  }

  /* --------------------------------------------------------------- tabs */
  .tabs { display: flex; padding: 0 var(--pad); border-bottom: 1px solid var(--line); position: sticky; top: 46px; background: var(--ink); z-index: 2; }
  .tab {
    appearance: none;
    background: none;
    border: 0;
    border-bottom: 2px solid transparent;
    color: var(--mute);
    font: inherit;
    font-size: 12px;
    padding: 9px 11px;
    cursor: pointer;
  }
  .tab:hover { color: var(--paper); }
  .tab .n { color: var(--amber); font-variant-numeric: tabular-nums; margin-left: 4px; }
  .tab[aria-selected="true"] { color: var(--paper); border-bottom-color: var(--amber); }
  .tab:focus-visible { outline: 2px solid var(--amber); outline-offset: -3px; }

  .pane.enter { animation: shutter .18s ease-out; }
  @keyframes shutter {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: none; }
  }

  /* ------------------------------------------------------------ controls */
  input[type="search"], input[type="url"], input[type="password"], input[type="text"], select {
    appearance: none;
    background: var(--ink-2);
    border: 1px solid var(--line);
    border-radius: 7px;
    color: var(--paper);
    font: inherit;
    font-size: 12px;
    padding: 6px 8px;
    min-width: 0;
  }
  input[type="search"]::-webkit-search-cancel-button { filter: invert(.6); }
  select { padding-right: 22px; cursor: pointer; }
  input[type="search"]:focus-visible, input[type="url"]:focus-visible, input[type="password"]:focus-visible, input[type="text"]:focus-visible, select:focus-visible { outline: 2px solid var(--amber); outline-offset: -1px; }

  .toolbar { display: flex; gap: 6px; padding: 9px var(--pad); border-bottom: 1px solid var(--line); }

  /* ------------------------------------------------ les puces de magasin */
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    padding: 8px var(--pad);
    border-bottom: 1px solid var(--line);
  }
  .chip {
    display: inline-flex;
    align-items: baseline;
    gap: 5px;
    padding: 3px 9px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--mute);
    font-size: 11px;
    line-height: 1.4;
  }
  .chip .n { font-variant-numeric: tabular-nums; opacity: .8; }
  .chip:hover { color: var(--paper); border-color: var(--mute); }
  .chip[aria-pressed="true"] {
    background: color-mix(in srgb, var(--amber) 16%, transparent);
    border-color: var(--amber);
    color: var(--amber);
  }
  .toolbar input[type="search"] { flex: 1; }
  /* 48 % : a 41, « Fin la plus proche » etait coupe en « Fin la plus proc ». */
  .toolbar select { flex: none; max-width: 48%; }

  button {
    appearance: none;
    font: inherit;
    cursor: pointer;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: var(--ink-2);
    color: var(--paper);
    padding: 7px 10px;
    font-size: 12px;
  }
  button:hover { border-color: var(--mute); }
  button:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
  button:disabled { opacity: .5; cursor: default; }

  button.primary {
    background: linear-gradient(180deg, var(--amber), var(--amber-d));
    border-color: transparent;
    color: #1A1206;
    font-weight: 600;
  }
  /* Le petit bouton (2.60.0). Il remplace les textes soulignes qui faisaient
     office de boutons : « Repartir de zero », « Reessayer », « Retirer »...
     Un lien souligne se lit comme une adresse, pas comme un geste, et se
     perdait au milieu des textes gris. Une pilule a bordure se voit, se vise,
     et dit « appuyez ici ». */
  .btn-sm {
    flex: none;
    padding: 4px 11px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--ink-2);
    color: var(--paper);
    font-size: 11px;
    line-height: 1.4;
    white-space: nowrap;
  }
  .btn-sm:hover:not(:disabled) { border-color: var(--amber); color: var(--amber); }
  /* Ce qui efface : la meme pilule, qui rougit au survol. */
  .btn-sm.danger:hover:not(:disabled) { border-color: var(--rose); color: var(--rose); }
  .actions .btn-sm { flex: none; min-width: 0; }

  .actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .actions button:not(.btn-sm) { flex: 1; min-width: 92px; }

  /* --------------------------------------- signature: the depleting ring */
  /* A free offer is free for a while. The artwork carries its own countdown,
     so the card needs no separate full-width bar -- one row less, and the
     eye lands on the game rather than on a gauge. */
  .game {
    display: flex;
    gap: 10px;
    width: 100%;
    text-align: left;
    align-items: center;
    padding: 6px 7px;
    margin-bottom: 2px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 9px;
    color: inherit;
  }
  .game:hover { background: var(--ink-2); border-color: var(--line); }

  /* La jaquette est PAYSAGE depuis la 2.35.0.
     Les trois magasins servent des visuels larges -- vignettes Epic, en-tetes
     Steam, jaquettes GOG. Les recadrer en carre a 40 px coupait le titre du
     jeu peint dessus, et il ne restait qu'une texture. Le format 8:5 montre
     l'illustration telle qu'elle a ete dessinee, pour douze pixels de plus. */
  .art { position: relative; width: 64px; height: 40px; flex: none; }
  .art > img, .art > .letter {
    width: 100%;
    height: 100%;
    border-radius: 6px;
    background: var(--ink-3);
    object-fit: cover;
    display: block;
  }
  .art > .letter {
    display: grid;
    place-items: center;
    font-family: var(--display);
    font-size: 18px;
    color: var(--mute);
  }

  .ring {
    position: absolute;
    inset: -4px;
    border-radius: 10px;
    padding: 2px;
    pointer-events: none;
    /* Pas de `from` : un conic-gradient CSS demarre deja a midi et tourne dans
       le sens des aiguilles. Un `from -90deg` ajoute par habitude du canvas
       faisait partir l'arc a 9 h, et une offre a 3 % montrait sa marque sur le
       bord gauche au lieu du sommet. */
    background: conic-gradient(var(--tier) calc(var(--p) * 1%), var(--rail) 0);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask-composite: exclude;
  }
  .ring.calm { --tier: var(--mute); }
  .ring.warm { --tier: var(--amber); }
  .ring.hot  { --tier: var(--rose); }

  /* Unknown end: a dashed ring, never an empty one. The scheduler puts these
     offers at the FRONT of the queue -- a date we do not know is not a distant
     one -- and the eye must read the same urgency. */
  .ring.unknown {
    background: repeating-conic-gradient(var(--amber) 0 5deg, transparent 5deg 11deg);
  }

  .game-body { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 3px; }
  .game-title { font-weight: 600; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .game-meta { display: flex; align-items: center; gap: 6px; min-width: 0; }

  /* Ce que l'offre EST, et ce qu'on peut en FAIRE : deux natures, deux
     rangees. Les cinq actions vivaient dans la ligne ci-dessus, a cote du
     magasin, de la valeur et du compte a rebours -- a 328 px de large, plus
     rien ne s'y lisait.

     La rangee garde sa hauteur meme vide : sans cela, survoler une carte la
     ferait grandir, et toute la liste sauterait sous le curseur. */
  .game-actions {
    display: flex;
    align-items: center;
    gap: 2px;
    min-height: 20px;
    margin-left: -4px;
  }

  .store-tag {
    font-family: var(--display);
    font-size: 9.5px;
    letter-spacing: .11em;
    text-transform: uppercase;
    color: var(--tag, var(--mute));
    flex: none;
  }
  /* « DLC » : la meme typographie que le magasin, dans une pastille. */
  .kind-tag {
    font-family: var(--display);
    font-size: 8.5px;
    letter-spacing: .1em;
    padding: 1px 5px;
    border-radius: 4px;
    border: 1px solid var(--line);
    color: var(--mute);
    flex: none;
  }
  .store-tag.epic   { --tag: var(--epic); }
  .store-tag.epic-mobile { --tag: var(--epic); }
  .store-tag.gog    { --tag: var(--gog); }
  .store-tag.steam  { --tag: var(--steam); }
  .store-tag.amazon { --tag: var(--amazon); }
  /* Steam Deck : dit seulement quand Steam l'a dit (voir watch/deck.js). */
  .deck { font-family: var(--display); font-size: 9.5px; letter-spacing: .06em; color: var(--mute); flex: none; }
  .deck.verified { color: var(--jade); }

  .worth { font-size: 11px; color: var(--mute); font-variant-numeric: tabular-nums; flex: none; }

  /* La note Steam (2.78.0) : la couleur dit le sens, le chiffre dit combien. */
  .rating { font-size: 10.5px; color: var(--mute); font-variant-numeric: tabular-nums; white-space: nowrap; flex: none; }
  .rating.good  { color: var(--jade); }
  .rating.mixed { color: var(--amber); }
  .rating.bad   { color: var(--rose); }
  .game-actions .rating { margin-left: auto; padding-right: 2px; }

  /* The countdown reads as a chip, and its colour is the whole message.
     Digits, not words: "3 h 40" is checkable, "soon" is not. */
  .left {
    margin-left: auto;
    flex: none;
    font-family: var(--mono);
    font-size: 10.5px;
    font-variant-numeric: tabular-nums;
    padding: 2px 6px;
    border-radius: 999px;
    color: var(--mute);
    background: color-mix(in srgb, var(--mute) 12%, transparent);
    white-space: nowrap;
  }
  .left.warm { color: var(--amber); background: color-mix(in srgb, var(--amber) 16%, transparent); }
  .left.hot  { color: var(--rose);  background: color-mix(in srgb, var(--rose) 18%, transparent); font-weight: 600; }
  .left.unknown { color: var(--amber); background: none; border: 1px dashed color-mix(in srgb, var(--amber) 55%, transparent); }

  /* Under an hour, the chip breathes. One accessory, on the one card that
     deserves it. */
  .left.hot.final { animation: breathe 1.9s ease-in-out infinite; }
  @keyframes breathe {
    0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--rose) 45%, transparent); }
    50%      { box-shadow: 0 0 0 4px color-mix(in srgb, var(--rose) 0%, transparent); }
  }

  /* Separateur d'echeance : une ligne de reperes dans une liste de quarante
     offres. Discret par construction -- il structure, il ne se lit pas. */
  .horizon {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 12px 0 5px;
    font-family: var(--display);
    font-size: 9.5px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--mute);
  }
  .horizon::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
    order: 1;
  }
  .horizon .n { order: 2; font-variant-numeric: tabular-nums; }

  /* Nouveau depuis la derniere ouverture. Une marque, pas une couleur de fond :
     a la troisieme ouverture de la journee, on veut voir ce qui a bouge sans
     que la liste change d'aspect. */
  .game.fresh { position: relative; }
  .game.fresh::before {
    content: "";
    position: absolute;
    left: -1px;
    top: 12px;
    bottom: 12px;
    width: 2px;
    border-radius: 2px;
    background: var(--amber);
  }

  .changed { font-size: 11px; color: var(--mute); margin: -4px 0 8px; }

  .worth.own { color: var(--jade); }
  /* Un montant converti se signale sans crier : le signe « environ » porte
     deja l'information, l'infobulle donne le montant d'origine et la date
     du taux. */
  .worth.approx { opacity: 0.85; cursor: help; }

  /* Le motif d'ecart, sous la ligne de meta : pourquoi cette offre ne sera pas
     prise pour vous. */
  .why {
    font-size: 10px;
    color: var(--mute);
    font-style: italic;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    /* Dans la rangee des actions, poussee a droite. Au survol elle cede la
       place aux boutons plutot que de les tasser. */
    margin-left: auto;
    min-width: 0;
    padding-left: 6px;
  }
  .game:hover .why, .game:focus-within .why { display: none; }

  .pin {
    flex: none;
    background: none;
    border: 0;
    /* Une cible de 20 px de haut : assez pour viser sans que cinq boutons ne
       poussent la carte plus haut qu'une ligne de texte. */
    padding: 3px 5px;
    color: var(--mute);
    font-size: 12px;
    opacity: 0;
    border-radius: 5px;
    line-height: 1;
  }
  /* Une action qui EXPRIME un choix deja fait reste visible : l'etoile posee,
     le coeur pose. Les autres s'effacent tant que la carte n'est pas survolee
     -- une liste de vingt offres avec cent boutons allumes ne se lit plus. */
  .game:hover .pin, .game:focus-within .pin, .pin.on, .pin:focus-visible { opacity: 1; }
  .pin:hover { background: var(--ink-3); color: var(--paper); }
  .pin.on { color: var(--amber); }
  .pin:disabled { opacity: .35; }

  /* La reclamation a l'unite est la seule action qui AGISSE sur un compte :
     elle se distingue des quatre autres, qui ne font que trier. */
  .pin.go { color: var(--jade); font-size: 13px; }
  .pin.go:hover { background: color-mix(in srgb, var(--jade) 18%, transparent); color: var(--jade); }
  /* Le refus est le seul geste irreversible de la rangee. */
  .pin.drop:hover { background: color-mix(in srgb, var(--rose) 18%, transparent); color: var(--rose); }

  /* ---------------------------------------------------------- plain rows */
  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    text-align: left;
    padding: 5px 0;
    border: 0;
    border-bottom: 1px solid color-mix(in srgb, var(--line) 55%, transparent);
    border-radius: 0;
    background: none;
    color: inherit;
    font-size: 12px;
    min-width: 0;
  }
  .row:last-child { border-bottom: 0; }
  .row:hover { background: none; }

  /* Une ligne qui MENE quelque part le montre.
     Sans ce retour, la section « Bientot » aurait des lignes cliquables
     impossibles a distinguer de celles qui ne le sont pas -- et on n'essaie
     pas de cliquer ce qui n'a pas l'air cliquable. */
  .row.go { cursor: pointer; }
  .row.go:hover {
    background: color-mix(in srgb, var(--amber) 12%, transparent);
    border-radius: 6px;
  }
  .row.go:hover .label { color: var(--amber); }
  .row.go:focus-visible {
    outline: 2px solid var(--amber);
    outline-offset: 1px;
    border-radius: 6px;
  }
  /* « Bientot » : la jaquette en paysage, comme les cartes, et une fleche
     visible sans survol quand la ligne ouvre la fiche du jeu. */
  #upcoming .row, #weekends .row { gap: 9px; padding: 5px 4px; }
  .soon-art { width: 40px; height: 25px; flex: none; display: block; }
  #upcoming .soon-art .mini, #weekends .soon-art .mini, .soon-art .letter {
    width: 100%; height: 100%; border-radius: 4px; object-fit: cover;
    background: var(--ink-3); opacity: 1; display: grid; place-items: center;
    font-family: var(--display); font-size: 12px; color: var(--mute);
  }
  .soon-body { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1; }
  .soon-body .label { flex: none; }
  .soon-body .store-tag { font-size: 8.5px; }
  .soon-go { flex: none; color: var(--mute); font-size: 12px; width: 12px; text-align: center; }
  /* Week-ends gratuits (2.75.0) : le prix si on veut le garder, en retrait. */
  .soon-body .soon-price { font-size: 10.5px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  :root[data-vue="onglet"] #weekends { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 0 12px; }
  .row.go:hover .soon-go { color: var(--amber); }
  .row .mini {
    width: 24px;
    height: 24px;
    flex: none;
    border-radius: 4px;
    object-fit: cover;
    background: var(--ink-3);
    opacity: .85;
  }
  .row .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .row .aside {
    flex: none;
    margin-left: auto;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--mute);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .row .aside.hi { color: var(--amber); }

  /* L'etat de session, sous la ligne du magasin.
     Une deuxieme ligne plutot qu'une colonne de plus : a 328 px, « Epic Games
     Store » et « pret, 4 recuperes » remplissent deja la largeur. */
  .session {
    display: flex;
    align-items: baseline;
    gap: 6px;
    padding: 0 var(--pad) 8px;
    margin-top: -5px;
    font-size: 10.5px;
    color: var(--mute);
    border-bottom: 1px solid var(--line);
  }
  /* Le trait de separation appartient au BAS du bloc, pas au milieu. Sans
     ceci, « connecte il y a 2 h » tombait sous la ligne d'Epic et avait l'air
     de decrire GOG -- l'inverse exact de ce que la ligne dit. */
  .row:has(+ .session) { border-bottom: 0; }
  .session:last-child { border-bottom: 0; }
  .session .who { font-family: var(--mono); }
  .session .who.out { color: var(--rose); }
  .session .who.ok { color: var(--jade); }
  .sessions-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 9px var(--pad) 0;
  }
  /* `.aside` n'est defini que DANS une rangee : hors d'elle, le resume
     repartait a la taille du corps de texte. */
  .sessions-head .aside { color: var(--mute); font-size: 11px; }
  .sessions-head .aside.hi { color: var(--amber); }

  /* Le graphique du Bilan (2.72.0) : une serie, des colonnes fines a bout
     arrondi posees sur une ligne de base, la valeur ecrite sur deux batons
     seulement -- le plus haut et le mois en cours --, le reste dans
     l'infobulle et le tableau. */
  .mchart { position: relative; margin: 12px 0 4px; }
  .mchart-title { font-size: 11px; color: var(--mute); margin: 0 0 8px; }
  .mchart-plot { display: flex; align-items: flex-end; gap: 2px; height: 78px; border-bottom: 1px solid var(--line); }
  :root[data-vue="onglet"] .mchart-plot { height: 128px; }
  .mcol {
    flex: 1; min-width: 0; height: 100%;
    display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
    border-radius: 4px; outline: none;
  }
  .mcol:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
  .mbar { width: min(24px, 72%); border-radius: 4px 4px 0 0; background: var(--chart); }
  .mcol:hover .mbar, .mcol:focus-visible .mbar { filter: brightness(1.15); }
  .mval { font: 600 10px/1 var(--mono); color: var(--paper); margin-bottom: 4px; font-variant-numeric: tabular-nums; }
  .mchart-months { display: flex; gap: 2px; margin-top: 4px; }
  .mchart-months span { flex: 1; min-width: 0; text-align: center; font-size: 9.5px; color: var(--mute); text-transform: capitalize; }
  .mchart-tip {
    position: absolute; z-index: 3; pointer-events: none; transform: translate(-50%, -100%);
    padding: 5px 8px; border-radius: 6px; background: var(--ink-3); border: 1px solid var(--line);
    font-size: 11px; line-height: 1.35; white-space: nowrap; box-shadow: 0 4px 14px rgba(0,0,0,.25);
  }
  .mchart-tip b { color: var(--paper); font-weight: 600; }
  .mchart-tip span { color: var(--mute); }
  .mchart-table summary { font-size: 11px; color: var(--mute); cursor: pointer; margin-top: 8px; }
  .mchart-table table { width: 100%; border-collapse: collapse; margin-top: 4px; font-size: 11px; }
  .mchart-table th, .mchart-table td { padding: 2px 4px; text-align: right; font-variant-numeric: tabular-nums; }
  .mchart-table th { color: var(--mute); font-weight: 500; }
  .mchart-table th:first-child, .mchart-table td:first-child { text-align: left; }

  /* Le chiffre du tableau de bord (2.76.0) : la police du reste, en grand,
     chiffres proportionnels ; le libelle et la ligne du dessous en retrait. */
  .hero { display: none; }
  :root[data-vue="onglet"] .hero:not([hidden]) {
    display: block;
    padding: 18px var(--pad) 16px;
    border-bottom: 1px solid var(--line);
  }
  .hero-label { margin: 0; font-size: 12px; color: var(--mute); }
  .hero-value { margin: 2px 0 4px; font: 600 52px/1.05 var(--body); color: var(--paper); letter-spacing: -0.01em; }
  .hero-sub { margin: 0; font-size: 12.5px; color: var(--mute); display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .hero-delta { color: var(--jade); }
  .hero-delta:empty { display: none; }

  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--jade); }
  .dot.paused { background: var(--amber); }
  .dot.off { background: var(--line); }
  .dot.bad { background: var(--rose); }

  /* Les raccourcis clavier (2.69.0) : la touche a droite, en petites capsules. */
  #shortcuts .row .aside kbd {
    font-family: var(--mono);
    font-size: 10.5px;
    padding: 1px 5px;
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 4px;
    color: var(--paper);
    background: var(--ink-2);
  }

  /* L'essai a blanc (2.64.0) : une ligne par magasin, puis ce que la page a
     montre. Meme gabarit que l'etat de session juste au-dessus. */
  #dry-run-results { padding: 4px var(--pad) 0; }
  #dry-run-results .row { padding: 4px 0 2px; border-bottom: 0; }
  #dry-run-results .row .aside.bad { color: var(--rose); }
  #dry-run-results .row .aside.ok { color: var(--jade); }
  .dry-text {
    margin: 0 0 6px 15px;
    font-size: 10.5px;
    line-height: 1.4;
    color: var(--mute);
    overflow-wrap: anywhere;
  }
  .dry-text:last-child { margin-bottom: 2px; }

  /* --------------------------------------------------------------- log */
  .log { list-style: none; margin: 0; padding: 0; }
  .log li { display: flex; gap: 8px; align-items: center; padding: 4px 0; font-size: 12px; min-width: 0; }
  .log .mini { width: 32px; height: 20px; flex: none; border-radius: 4px; object-fit: cover; background: var(--ink-3); }
  .log .what { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .log .st { flex: none; margin-left: auto; font-size: 11px; }
  .log-foot { display: flex; justify-content: center; margin-top: 10px; }

  /* ------------------------------------------------- signature: tickets */
  .ticket {
    position: relative;
    background: var(--ink-2);
    border: 1px solid var(--line);
    border-left: 3px solid var(--amber);
    border-radius: 4px 10px 10px 4px;
    padding: 10px 11px 10px 16px;
    margin-bottom: 7px;
    animation: rise .32s cubic-bezier(.2, .7, .3, 1) backwards;
  }
  /* Side notches: this is not a card, it is a detachable coupon. */
  .ticket::before,
  .ticket::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--ink);
    transform: translateY(-50%);
  }
  .ticket::before { left: -6px; }
  .ticket::after  { right: -6px; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }

  .ticket-head { display: flex; align-items: baseline; gap: 7px; margin-bottom: 7px; min-width: 0; }
  .ticket-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ticket-head .store-tag { margin-left: auto; }

  .code-row { display: flex; gap: 6px; align-items: center; }
  .code {
    flex: 1;
    font-family: var(--mono);
    font-size: 12px;
    background: var(--rail);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 8px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    user-select: all;
  }
  .copy { flex: none; }
  .copy.done { color: var(--jade); border-color: var(--jade); }
  .deadline { margin-top: 7px; font-size: 11px; color: var(--mute); }
  .deadline.urgent { color: var(--rose); }

  /* ------------------------------------------------------------ toggles */
  .toggle { display: flex; align-items: center; gap: 9px; padding: 5px 0; cursor: pointer; }
  .toggle input { position: absolute; opacity: 0; pointer-events: none; }
  .switch {
    flex: none;
    width: 32px;
    height: 18px;
    border-radius: 999px;
    background: var(--rail);
    border: 1px solid var(--line);
    position: relative;
    transition: background .16s, border-color .16s;
  }
  .switch::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--mute);
    transition: transform .16s, background .16s;
  }
  .toggle input:checked + .switch { background: color-mix(in srgb, var(--amber) 30%, transparent); border-color: var(--amber); }
  .toggle input:checked + .switch::after { transform: translateX(14px); background: var(--amber); }
  .toggle input:focus-visible + .switch { outline: 2px solid var(--amber); outline-offset: 2px; }
  .toggle-label { font-size: 12px; line-height: 1.35; }
  .toggle-label small { display: block; color: var(--mute); font-size: 10.5px; }

  /* --------------------------------------------------------- checkboxes */
  .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px; }
  .check { display: flex; align-items: center; gap: 7px; font-size: 12px; padding: 3px 0; cursor: pointer; min-width: 0; }
  .check input { position: absolute; opacity: 0; pointer-events: none; }
  .box {
    flex: none;
    width: 14px;
    height: 14px;
    border-radius: 4px;
    border: 1px solid var(--line);
    background: var(--rail);
    position: relative;
  }
  .check input:checked + .box { background: var(--amber); border-color: var(--amber); }
  .check input:checked + .box::after {
    content: "";
    position: absolute;
    left: 4px;
    top: 1px;
    width: 4px;
    height: 8px;
    border: solid #1A1206;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
  .check input:focus-visible + .box { outline: 2px solid var(--amber); outline-offset: 2px; }
  .check span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* -------------------------------------------------------------- range */
  .range { display: block; padding: 7px 0 2px; }
  .range-label { display: block; font-size: 12px; margin-bottom: 5px; }
  .range-label b { color: var(--amber); font-variant-numeric: tabular-nums; }
  input[type="range"] {
    appearance: none;
    width: 100%;
    height: 3px;
    border-radius: 2px;
    background: var(--rail);
    margin: 6px 0;
  }
  input[type="range"]::-webkit-slider-thumb {
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--amber);
    border: 0;
    cursor: pointer;
  }
  input[type="range"]:focus-visible { outline: 2px solid var(--amber); outline-offset: 4px; }

  .field { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 12px; }
  .field select { margin-left: auto; }
  .field .pair { margin-left: auto; display: flex; gap: 5px; align-items: center; }
  /* Une adresse ne tient pas a droite d'un libelle a 328 px : elle passe dessous. */
  .field.stack { flex-direction: column; align-items: stretch; gap: 4px; }
  .field.stack input { width: 100%; font-family: var(--mono); font-size: 11px; }
  #phone-fields[hidden] { display: none; }
  input[type="time"] {
    background: var(--ink-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--paper);
    font: inherit;
    font-size: 12px;
    padding: 4px 6px;
  }

  /* ------------------------------------------------------------ details */
  details { border-top: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }
  details:first-of-type { border-top: 0; }
  summary {
    cursor: pointer;
    padding: 8px 0;
    font-size: 12px;
    color: var(--paper);
    list-style: none;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  summary::-webkit-details-marker { display: none; }
  summary::before {
    content: "";
    width: 5px;
    height: 5px;
    border-right: 1.5px solid var(--mute);
    border-bottom: 1.5px solid var(--mute);
    transform: rotate(-45deg);
    transition: transform .16s;
    flex: none;
  }
  details[open] > summary::before { transform: rotate(45deg); }
  summary .aside { margin-left: auto; color: var(--mute); font-size: 11px; }
  summary:focus-visible { outline: 2px solid var(--amber); outline-offset: -2px; }
  details > *:not(summary):last-child { padding-bottom: 8px; }

  /* SECTION REPLIABLE.
   *
   * L'onglet Reglages faisait 1592 px de haut dans une fenetre qui en montre
   * 560 : trois ecrans de defilement pour neuf sections. Huit se replient
   * desormais ; seul l'arret d'urgence reste deplie, parce qu'une section
   * qu'on ouvre en panique ne se cherche pas.
   *
   * Le `<h2>` reste DANS le `<summary>` plutot que d'etre remplace par lui :
   * le titre garde son allure, et un lecteur d'ecran garde son niveau de
   * titre. Un `<summary>` nu aurait coute les deux.
   *
   * REPLIER N'EST PAS CACHER. Un pli ferme garde sa ligne de resume a droite
   * -- « 4 suivis », « autonome » -- et il s'ouvre de lui-meme quand il a une
   * alerte a montrer : un canari, une source en repli, une session perdue.
   * Voir `fold` dans popup.js. Sans cela, replier les magasins et la veille
   * aurait enterre les deux seuls endroits ou l'extension crie. */
  .fold { border-top: 0; }
  .fold > summary { padding: 0; }
  .fold > summary > h2 { margin: 0; }
  .fold[open] > summary > h2 { margin-bottom: 10px; }
  .fold > summary::before { margin-bottom: 1px; }
  .fold[open] > summary::before { margin-bottom: 11px; }
  /* Le resume suit la marge du titre : sans cela, `align-items: center`
     le decale d'une demi-marge des que le pli s'ouvre. */
  .fold[open] > summary > .aside { margin-bottom: 10px; }

  /* --------------------------------------------------------- prediction */
  .pred { margin-bottom: 9px; }
  .pred-name {
    display: flex;
    align-items: baseline;
    gap: 7px;
    font-size: 11px;
    color: var(--mute);
    margin-bottom: 4px;
  }
  .pred-name .peak { margin-left: auto; color: var(--amber); }
  .pred-band { display: flex; gap: 1px; height: 16px; align-items: flex-end; }
  .pred-band i {
    flex: 1;
    background: var(--amber);
    border-radius: 1px;
    height: 100%;
    min-width: 0;
  }
  .pred-band i.mark { box-shadow: inset 0 -14px 0 0 color-mix(in srgb, var(--paper) 22%, transparent); }
  .pred-axis { display: flex; justify-content: space-between; font-size: 10px; color: var(--mute); margin-top: 3px; }

  /* -------------------------------------------------------------- meter */
  .meter { height: 4px; border-radius: 3px; background: var(--rail); overflow: hidden; margin: 6px 0 4px; }
  .meter i { display: block; height: 100%; background: var(--mute); border-radius: 3px; }
  .meter i.high { background: var(--rose); }

  /* ------------------------------------------------------------ onboard */
  .onboard {
    margin: var(--pad) var(--pad) 0;
    padding: 11px 12px;
    border: 1px solid var(--amber);
    border-radius: 9px;
    background: color-mix(in srgb, var(--amber) 9%, transparent);
    font-size: 12px;
    line-height: 1.5;
  }
  .onboard h3 { margin: 0 0 5px; font-size: 12px; font-family: var(--display); letter-spacing: .04em; }

  /* --------------------------------------------------------------- undo */
  .undo {
    position: sticky;
    bottom: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px var(--pad);
    background: var(--ink-3);
    border-top: 1px solid var(--line);
    font-size: 12px;
    z-index: 4;
  }
  .undo button { margin-left: auto; }

  /* ------------------------------------------------------------- footer */
  /* Trois liens et une phrase ne tiennent pas sur 328 px : la phrase prend sa
     ligne, les liens la suivante. Sans le retour, la phrase s'ecrasait sur
     cinq lignes d'un mot a cote des liens. */
  footer {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 10px;
    padding: 9px var(--pad);
    border-top: 1px solid var(--line);
  }
  footer .grow { flex: 1 1 100%; min-width: 0; }
  footer .grow:empty { display: none; }
  /* Les autres pages : trois boutons, et le diagnostic en icone -- il ne sert
     qu'aux mesures, il n'a pas a peser autant que la collection. */
  footer .btn-sm:first-of-type { margin-left: auto; }
  footer .icon-button { margin-right: 0; }

  /* ------------------------------------------------ le tableau de bord
     Le MEME popup, ouvert en grand dans un onglet (2.58.0) : l'onglet dedie
     du design (§9), sans une seconde page qu'il faudrait tenir d'accord avec
     celle-ci -- un reglage ajoute au popup y est aussitot.

     `data-vue="onglet"` est pose par popup.js, qui sait ou il tourne ; jamais
     dans le vrai popup, dont la largeur reste fixe. Sous 760 px de large,
     l'onglet garde les trois onglets du popup, a pleine largeur. Au-dela, les
     volets se posent cote a cote : les jeux en large, les codes et la veille
     a cote, les reglages au bout. */
  .pane-title { display: none; }

  :root[data-vue="onglet"], :root[data-vue="onglet"] body { width: auto; }
  :root[data-vue="onglet"] body {
    max-height: none;
    overflow: visible;
    max-width: 1480px;
    margin: 0 auto;
  }
  :root[data-vue="onglet"] #open-dashboard { display: none; }

  @media (min-width: 760px) {
    :root[data-vue="onglet"] .tabs { display: none; }
    :root[data-vue="onglet"] .panes {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 400px);
      grid-template-areas: "games codes" "games settings";
      grid-template-rows: auto 1fr;
    }
    :root[data-vue="onglet"] #pane-games { grid-area: games; }
    :root[data-vue="onglet"] #pane-codes { grid-area: codes; border-left: 1px solid var(--line); }
    :root[data-vue="onglet"] #pane-settings { grid-area: settings; border-left: 1px solid var(--line); border-top: 1px solid var(--line); }
    /* 1, 2, 3 font defiler jusqu'au volet : il s'arrete sous l'en-tete. */
    :root[data-vue="onglet"] .pane { scroll-margin-top: 56px; }

    :root[data-vue="onglet"] .pane-title {
      display: block;
      margin: 0;
      padding: 14px var(--pad) 0;
      font-size: 11px;
      color: var(--paper);
    }

    /* Les jeux en grille : une carte par case, et les reperes d'echeance
       sur toute la largeur. */
    :root[data-vue="onglet"] #games,
    :root[data-vue="onglet"] #upcoming {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      column-gap: 14px;
      align-items: start;
    }
    :root[data-vue="onglet"] #games > .horizon,
    :root[data-vue="onglet"] #games > .empty { grid-column: 1 / -1; }
    :root[data-vue="onglet"] #upcoming .row:last-child { border-bottom: 1px solid color-mix(in srgb, var(--line) 55%, transparent); }
    :root[data-vue="onglet"] .art { width: 88px; height: 55px; }
    :root[data-vue="onglet"] .log { columns: 300px; column-gap: 24px; }
    :root[data-vue="onglet"] .log li { break-inside: avoid; }
    :root[data-vue="onglet"] .toolbar input[type="search"] { max-width: 420px; }

    /* Les liens vers les autres pages restent a portee : sous une colonne de
       quarante jeux, le pied de page serait a trois ecrans de l'en-tete. */
    :root[data-vue="onglet"] footer {
      position: sticky;
      bottom: 0;
      z-index: 3;
      flex-wrap: nowrap;
      background: var(--ink);
      /* Une hauteur ENTIERE : a 35,5 px, le demi-pixel du bas laissait
         passer le haut des lignes qui defilent dessous. */
      height: 40px;
    }
    :root[data-vue="onglet"] footer .grow { flex: 1 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  }

  @media (min-width: 1240px) {
    :root[data-vue="onglet"] .panes {
      grid-template-columns: minmax(0, 1fr) minmax(300px, 360px) minmax(340px, 400px);
      grid-template-areas: "games codes settings";
      grid-template-rows: auto;
    }
    :root[data-vue="onglet"] #pane-settings { border-top: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .ticket, .pane.enter, .left.hot.final { animation: none; }
    * { transition: none !important; }
    /* The indicator stays visible but stops running: a half-filled bar says
       "working" without moving. */
    .working::after {
      animation: none;
      transform: none;
      width: 45%;
      background: var(--amber);
    }
  }
</style>
</head>

        <label class="toggle" id="auto-backup-row" hidden>
          <input type="checkbox" id="auto-backup">
          <span class="switch"></span>
          <span class="toggle-label"><span data-i18n="autoBackupLabel"></span><small data-i18n="autoBackupHint"></small></span>
        </label>
        <p class="hint" id="auto-backup-state" hidden></p>
        <div class="log-foot"><button class="btn-sm" id="auto-backup-show" data-i18n="autoBackupShow" hidden></button></div>

        <label class="toggle">
          <input type="checkbox" id="sync-codes">
          <span class="switch"></span>
          <span class="toggle-label"><span data-i18n="syncCodesLabel"></span><small data-i18n="syncCodesHint"></small></span>
        </label>
        <p class="hint" id="sync-state"></p>

        <label class="toggle">
          <input type="checkbox" id="sync-library">
          <span class="switch"></span>
          <span class="toggle-label"><span data-i18n="syncLibraryLabel"></span><small data-i18n="syncLibraryHint"></small></span>
        </label>
        <p class="hint" id="sync-library-state"></p>

        <p class="hint" id="backup-state"></p>
        <input type="file" id="import-file" accept="application/json,.json" hidden>
      </details>
    </section>

    <!-- Seulement pour une installation depuis un dossier (2.54.0). -->
    <section id="update-section" hidden>
      <details class="fold">
        <summary><h2 data-i18n="updateTitle"></h2></summary>
        <p class="hint" id="update-version"></p>
        <p class="hint" data-i18n="updateHint"></p>
        <div class="actions">
          <button id="update-now" data-i18n="updateNow"></button>
        </div>
        <p class="hint" id="update-state" role="status"></p>
      </details>
    </section>
  </div>

  </main>

  <div class="undo" id="undo" hidden>
    <span id="undo-text"></span>
    <button id="undo-do" data-i18n="undo"></button>
  </div>

  <footer>
    <span class="hint grow" id="foot"></span>
    <button class="btn-sm" id="open-collection" data-i18n="openCollection"></button>
    <button class="btn-sm" id="open-history" data-i18n="openHistory"></button>
    <button class="btn-sm" id="open-journal" data-i18n="navJournal"></button>
    <button class="icon-button" id="open-diagnostics" data-i18n-attr="title:diagnostics,aria-label:diagnostics">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M10.2 2.3a3.3 3.3 0 0 0-3.9 4.4L2.6 10.4a1.3 1.3 0 0 0 1.9 1.9l3.7-3.7a3.3 3.3 0 0 0 4.4-3.9l-2 2-1.8-.4-.4-1.8z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
    </button>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
