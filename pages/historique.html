<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Free Games Auto-Claimer</title>
<style>
  /* Memes jetons que popup.html, pour que la page n'ait pas l'air d'ailleurs.
     Le sombre est la base, le clair une surcharge -- « systeme » retire la
     surcharge et laisse la media query gagner. */
  :root {
    --ink:    #14101F;
    --ink-2:  #1E1830;
    --ink-3:  #262038;
    --line:   #2E2745;
    --rail:   #0E0A18;
    --paper:  #EDE9F5;
    --mute:   #9A90B8;
    --amber:  #FFB454;
    --amber-d:#FF8A3D;
    --jade:   #56D6A0;
    --rose:   #FF6B81;
    --epic:   #E4DDF5;
    --gog:    #A567FF;
    --steam:  #66C0F4;
    --amazon: #00C2FF;
    color-scheme: dark;

    --display: "Bahnschrift", "DIN Alternate", "Segoe UI Semibold", "Segoe UI", system-ui, sans-serif;
    --body:    "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono:    "Cascadia Mono", "Consolas", ui-monospace, monospace;
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --ink:    #FBFAFE;
      --ink-2:  #F2EFF9;
      --ink-3:  #E8E3F3;
      --line:   #DCD5EC;
      --rail:   #E2DCEF;
      --paper:  #1B1528;
      --mute:   #6E6488;
      --amber:  #B96A00;
      --amber-d:#A85400;
      --jade:   #12805B;
      --rose:   #D62B47;
      --epic:   #3D3459;
      --gog:    #7A32E0;
      --steam:  #1B7FB8;
      --amazon: #0079A8;
      color-scheme: light;
    }
  }

  :root[data-theme="light"] {
    --ink:    #FBFAFE;
    --ink-2:  #F2EFF9;
    --ink-3:  #E8E3F3;
    --line:   #DCD5EC;
    --rail:   #E2DCEF;
    --paper:  #1B1528;
    --mute:   #6E6488;
    --amber:  #B96A00;
    --amber-d:#A85400;
    --jade:   #12805B;
    --rose:   #D62B47;
    --epic:   #3D3459;
    --gog:    #7A32E0;
    --steam:  #1B7FB8;
    --amazon: #0079A8;
    color-scheme: light;
  }

  * { box-sizing: border-box; }

  /* ------------------------------------------------- barre de defilement
     Le pouce EST un ticket : le degrade ambre de icon.svg, des coins
     pleinement arrondis, et la ligne de perforation en pointilles qui le
     traverse dans sa longueur (l'icone la dessine en `stroke-dasharray`).
     La piste est le creux ou le ticket coulisse -- `--rail`, deja le token
     de tous les creux du produit.

     La couleur de la perforation est tiree de `--ink`, et c'est le tour de
     force du truc : `--ink` bascule avec le theme, donc la perforation
     bascule avec lui, dans le bon sens et sans une ligne de plus. Sombre
     sur ambre vif ; claire sur ambre brule.

     Pas de transition : Chrome n'anime pas les pseudo-elements de
     scrollbar. Le survol est un basculement net, et c'est assume. */

  ::-webkit-scrollbar { width: 12px; height: 12px; }

  ::-webkit-scrollbar-track { background: var(--rail); }
  ::-webkit-scrollbar-corner { background: var(--rail); }
  ::-webkit-scrollbar-button { display: none; }

  ::-webkit-scrollbar-thumb {
    /* Bordure transparente + content-box : une gouttiere de 2px, pour que le
       ticket ne touche jamais les bords de son rail. */
    border: 2px solid transparent;
    background-clip: content-box;
    border-radius: 999px;
    /* En dessous, la perforation n'aurait pas la place d'exister. */
    min-height: 36px;
    background-color: var(--amber-d);
    background-image:
      repeating-linear-gradient(180deg,
        color-mix(in srgb, var(--ink) 62%, transparent) 0 5px,
        transparent 5px 9px),
      linear-gradient(180deg, var(--amber), var(--amber-d));
    background-repeat: repeat-y, no-repeat;
    background-size: 2px 9px, auto;
    background-position: center top, 0 0;
  }

  ::-webkit-scrollbar-thumb:hover {
    background-image:
      repeating-linear-gradient(180deg,
        color-mix(in srgb, var(--ink) 72%, transparent) 0 5px,
        transparent 5px 9px),
      linear-gradient(180deg,
        color-mix(in srgb, var(--amber) 82%, white), var(--amber));
  }

  ::-webkit-scrollbar-thumb:active {
    background-image:
      repeating-linear-gradient(180deg,
        color-mix(in srgb, var(--ink) 80%, transparent) 0 5px,
        transparent 5px 9px),
      linear-gradient(180deg, var(--amber-d), var(--amber-d));
  }

  /* Le ticket couche : la perforation tourne avec lui. */
  ::-webkit-scrollbar-thumb:horizontal {
    min-height: 0;
    min-width: 36px;
    background-image:
      repeating-linear-gradient(90deg,
        color-mix(in srgb, var(--ink) 62%, transparent) 0 5px,
        transparent 5px 9px),
      linear-gradient(90deg, var(--amber), var(--amber-d));
    background-repeat: repeat-x, no-repeat;
    background-size: 9px 2px, auto;
    background-position: left center, 0 0;
  }

  /* Firefox n'a pas ces pseudo-elements : il recoit la version plate. Chrome,
     lui, comprend `selector(::-webkit-scrollbar)`, donc ce bloc ne s'y
     applique pas -- et surtout : poser `scrollbar-width` ou `scrollbar-color`
     sur un element fait IGNORER a Chromium (121+) tous ses
     `::-webkit-scrollbar-*`. Ces deux proprietes doivent donc rester hors de
     sa portee, sans quoi rien de ce qui precede ne s'affiche. */
  @supports not selector(::-webkit-scrollbar) {
    :root { scrollbar-width: thin; scrollbar-color: var(--amber-d) var(--rail); }
  }

  body {
    margin: 0;
    padding: 24px 20px 40px;
    background: var(--ink);
    color: var(--paper);
    font: 13px/1.5 var(--body);
  }

  .wrap { max-width: 980px; margin: 0 auto; }

  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  h1 { font: 600 19px/1.2 var(--display); margin: 0; letter-spacing: .02em; }
  .sub { color: var(--mute); font-size: 12px; margin: 0 0 18px; max-width: 70ch; }

  .counts { display: flex; gap: 10px; margin-left: auto; font-size: 12px; }
  .counts b { font-weight: 600; }
  .counts .warn b { color: var(--amber); }
  .counts .error b { color: var(--rose); }

  .bar {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    padding: 10px; margin-bottom: 14px;
    background: var(--ink-2); border: 1px solid var(--line); border-radius: 8px;
  }

  input[type="search"], select, button {
    font: inherit; color: var(--paper);
    background: var(--ink-3); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 10px;
  }
  input[type="search"] { flex: 1 1 200px; min-width: 160px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--amber); }
  button.danger:hover { border-color: var(--rose); color: var(--rose); }
  .spacer { flex: 1 1 auto; }

  table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12px; }
  th {
    text-align: left; font: 600 11px/1 var(--body); text-transform: uppercase;
    letter-spacing: .06em; color: var(--mute);
    padding: 0 10px 8px; border-bottom: 1px solid var(--line);
  }
  td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:hover td { background: var(--ink-2); }

  td.when { white-space: nowrap; color: var(--mute); width: 1%; }
  td.level { width: 1%; text-transform: uppercase; font-size: 11px; letter-spacing: .04em; }
  tr.warn td.level { color: var(--amber); }
  tr.error td.level { color: var(--rose); }
  tr.info td.level { color: var(--jade); }
  td.what { word-break: break-word; }
  .details { display: block; color: var(--mute); margin-top: 3px; white-space: pre-wrap; }

  .empty { color: var(--mute); padding: 28px 10px; text-align: center; }

  /* -------------------------------------------- la liste (2.83.0)
     La grammaire de « Deja recupere » dans le popup, en grand : jaquette,
     titre, magasin, valeur, date, et l'issue en icone. Groupee par mois ;
     l'en-tete du mois porte ce que le tableau « Mois par mois » disait. */
  .filters { display: flex; flex-direction: column; gap: 8px; flex: 1 1 100%; }
  .chip-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .chip-row > .lbl { font: 600 10.5px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--mute); min-width: 64px; }
  .chip {
    display: inline-flex; align-items: baseline; gap: 5px; padding: 3px 10px; border-radius: 999px;
    border: 1px solid var(--line); background: transparent; color: var(--mute); font-size: 12px; line-height: 1.45;
  }
  .chip .n { font-variant-numeric: tabular-nums; opacity: .8; }
  .chip:hover { color: var(--paper); border-color: var(--mute); }
  .chip[aria-pressed="true"] { background: color-mix(in srgb, var(--amber) 16%, transparent); border-color: var(--amber); color: var(--amber); }
  .month { margin: 18px 0 6px; }
  .month-head {
    display: flex; align-items: baseline; gap: 10px; margin: 0 0 8px; padding-bottom: 6px;
    border-bottom: 1px solid var(--line); font: 600 12px/1.2 var(--display); letter-spacing: .08em; text-transform: uppercase;
  }
  .month-head .n { color: var(--mute); font: 12px/1.2 var(--body); letter-spacing: 0; text-transform: none; margin-left: auto; }
  .games { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 2px 18px; }
  .game { display: flex; align-items: center; gap: 12px; padding: 7px 6px; border-radius: 8px; min-width: 0; }
  .game:hover { background: var(--ink-2); }
  .cover { width: 92px; height: 43px; flex: none; border-radius: 6px; overflow: hidden; background: var(--ink-3); display: grid; place-items: center; }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover .letter { font: 600 16px/1 var(--display); color: var(--mute); }
  .g-info { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 3px; }
  .g-info .title { font-weight: 600; font-size: 13px; color: var(--paper); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .g-info a.title:hover { color: var(--amber); }
  .meta { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--mute); min-width: 0; white-space: nowrap; }
  .store-tag { font: 600 9.5px/1 var(--display); letter-spacing: .11em; text-transform: uppercase; color: var(--tag, var(--mute)); }
  .store-tag.epic { --tag: var(--epic); }
  .store-tag.gog { --tag: var(--gog); }
  .store-tag.steam { --tag: var(--steam); }
  .store-tag.amazon { --tag: var(--amazon); }
  .meta .worth { font-variant-numeric: tabular-nums; }
  .st { flex: none; display: grid; place-items: center; width: 26px; height: 26px; }
  .st-icon { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .st-icon.ok { color: var(--jade); }
  .st-icon.miss { color: var(--amber); }
  .st-icon.unknown { color: var(--rose); }
  table.recur { font-family: var(--body); font-size: 12.5px; }
  h2 { font: 600 13px/1.2 var(--display); letter-spacing: .08em; text-transform: uppercase; margin: 30px 0 6px; }
  .note { color: var(--mute); font-size: 11px; margin-top: 16px; max-width: 70ch; }
</style>
<link rel="stylesheet" href="brut.css">
</head>
<body>
  <div class="wrap">
    <header>
      <h1 data-i18n="historyTitle"></h1>
      <div class="counts">
        <span class="info"><b id="count-taken">0</b> <span data-i18n="historyTaken"></span></span>
        <span class="warn"><b id="count-missed">0</b> <span data-i18n="historyMissed"></span></span>
        <span class="error"><b id="count-unknown">0</b> <span data-i18n="historyUnknown"></span></span>
      </div>
    </header>
    <p class="sub" data-i18n="historySub"></p>

    <p class="sub" id="rate"></p>

    <div class="bar">
      <div class="filters">
        <div class="chip-row" id="outcome-chips" role="group" data-i18n-attr="aria-label:historyOutcome">
          <span class="lbl" data-i18n="historyOutcome"></span>
        </div>
        <div class="chip-row" id="store-chips" role="group" data-i18n-attr="aria-label:historyStore">
          <span class="lbl" data-i18n="historyStore"></span>
        </div>
      </div>
      <input type="search" id="search" data-i18n-attr="placeholder:historySearch">
      <span class="spacer"></span>
      <button id="refresh" data-i18n="historyRefresh"></button>
      <button id="download" data-i18n="historyDownload"></button>
    </div>

    <div id="list"></div>
    <p class="empty" id="empty" hidden></p>

    <h2 data-i18n="historyRecurring"></h2>
    <p class="sub" data-i18n="historyRecurringSub"></p>
    <p class="sub" id="recurring-none" data-i18n="historyRecurringNone" hidden></p>
    <table class="recur" id="recurring-table">
      <thead>
        <tr>
          <th data-i18n="historyGame"></th>
          <th data-i18n="historyTimes"></th>
          <th data-i18n="historyLastSeen"></th>
        </tr>
      </thead>
      <tbody id="recurring"></tbody>
    </table>

    <p class="note" data-i18n="historyNote"></p>
  </div>

  <script src="historique.js" type="module"></script>
</body>
</html>
