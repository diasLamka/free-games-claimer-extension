# L'appli Android : ses tests, et son APK.
#
# A chaque push qui la touche -- ou qui touche le moteur qu'elle embarque,
# content/free-games-claimer.js et watch/steam-claim.js, recopies a chaque
# build --, l'APK est reconstruit et depose comme artefact du workflow.
#
# La release : sur `main`, des que `versionName` (android/app/build.gradle.kts)
# dit une version qui n'a pas encore sa release `app-vX.Y.Z`, le workflow la
# cree -- tag compris, sur le commit construit -- avec l'APK signe. Changer
# la version et pousser suffit ; un push qui ne la change pas ne publie rien.
#
# Un tag `app-vX.Y.Z` pousse a la main publie aussi, s'il dit la meme version
# que `versionName`, pour la meme raison que release.yml : Android refuse
# d'installer par-dessus une version qui se dit plus recente.
#
# Les cles de signature ne sont PAS dans le depot : elles viennent des secrets
# ANDROID_KEYSTORE_* (l'ancienne cle) et ANDROID_NEXT_KEYSTORE_* (la nouvelle),
# et n'existent sur le disque du runner que le temps du build (voir
# test/android-keystore.test.mjs). Sans eux, le build reste possible, l'APK n'est
# pas signe et rien n'est publie.
#
# La rotation (1.26.1) : AGP signe avec l'ancienne cle, puis apksigner resigne
# avec la chaine android/signing/lineage.bin (ancienne -> nouvelle ; APK Signature
# Scheme v3). Android 13 et plus adoptent la nouvelle cle et acceptent la mise a jour
# d'une appli installee avec l'ancienne ; les Android plus anciens gardent l'ancienne,
# qui doit donc rester ici. Un APK dont une empreinte n'est ni l'une ni l'autre, ou si la
# nouvelle manque, n'est jamais depose.
name: android

on:
  push:
    branches: ['**']
    tags: ['app-v*']
    paths:
      - 'android/**'
      - 'content/free-games-claimer.js'
      - 'watch/steam-claim.js'
      - 'test/fixtures/**'
      - 'package.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    # Un build normal prend quelques minutes ; au-dela, quelque chose est bloque.
    timeout-minutes: 30
    env:
      # Les empreintes SHA-256 des certificats : la cle courante (nouvelle) et celle d'origine (ancienne).
      SIGNING_SHA256: '28:C8:87:95:18:3A:E1:59:38:A1:DD:30:5C:A3:37:A5:8A:55:E8:F8:D9:DA:C6:FB:74:3B:7D:01:D3:0A:01:A8'
      SIGNING_ORIGIN_SHA256: '72:1A:F7:EA:41:FE:5C:AF:96:A8:A7:6B:7D:70:42:74:2C:A5:37:E4:04:A4:A5:7F:23:27:17:BA:47:55:45:C5'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          # Gradle, ses dependances et les jars Robolectric (le plus lourd) :
          # sans cache, chaque push les retelecharge.
          cache: gradle

      - name: Le tag et versionName doivent dire la meme version
        if: startsWith(github.ref, 'refs/tags/app-v')
        run: |
          tag="${GITHUB_REF_NAME#app-v}"
          appli="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts)"
          echo "tag : $tag / versionName : $appli"
          if [ "$tag" != "$appli" ]; then echo "::error::le tag dit $tag, l'appli dit $appli"; exit 1; fi

      - name: La cle de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::secrets de signature absents : l'APK ne sera pas signe"
            exit 0
          fi
          mkdir -p android/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/keystore/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/keystore/keystore.properties

      - name: Tests et APK
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      # AGP a signe avec l'ancienne cle ; on resigne avec la chaine de rotation (ancienne -> nouvelle).
      - name: Rotation de la cle de signature
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          NEXT_KEYSTORE_BASE64: ${{ secrets.ANDROID_NEXT_KEYSTORE_BASE64 }}
          NEXT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_NEXT_KEYSTORE_PASSWORD }}
          NEXT_KEY_ALIAS: ${{ secrets.ANDROID_NEXT_KEY_ALIAS }}
          NEXT_KEY_PASSWORD: ${{ secrets.ANDROID_NEXT_KEY_PASSWORD }}
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::warning::pas d'APK signe a resigner (secrets absents)"
            exit 0
          fi
          if [ -z "$NEXT_KEYSTORE_BASE64" ]; then
            echo "::error::la cle de rotation (ANDROID_NEXT_KEYSTORE_BASE64) est absente"
            exit 1
          fi
          next="$RUNNER_TEMP/release-next.jks"
          printf '%s' "$NEXT_KEYSTORE_BASE64" | base64 -d > "$next"
          apksigner="$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner | sort -V | tail -n1)"
          # Les mots de passe passent par l'environnement (env:), jamais par la ligne de commande.
          "$apksigner" sign \
            --ks android/keystore/release.jks --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --next-signer --ks "$next" --ks-key-alias "$NEXT_KEY_ALIAS" --ks-pass env:NEXT_KEYSTORE_PASSWORD --key-pass env:NEXT_KEY_PASSWORD \
            --lineage android/signing/lineage.bin --out "$RUNNER_TEMP/rotated.apk" "$apk"
          mv "$RUNNER_TEMP/rotated.apk" "$apk"
          rm -f "$next"

      # Nos deux cles, la nouvelle comprise, ou pas signe du tout (secrets absents) : jamais une autre.
      - name: Verifier la signature, renommer l'APK
        run: |
          v="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts)"
          apk="$(ls android/app/build/outputs/apk/release/*.apk | head -n1)"
          case "$apk" in
            *-unsigned.apk)
              echo "::warning::APK non signe : il ne sera pas publie"
              cp "$apk" "free-games-claimer-android-$v-unsigned.apk"
              ;;
            *)
              apksigner="$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner | sort -V | tail -n1)"
              # Ce que dit apksigner ne contient que des certificats (publics) : on l'imprime quand quelque chose cloche.
              out="$("$apksigner" verify --print-certs -v "$apk" 2>&1)" || { printf '%s\n' "$out"; echo "::error::apksigner refuse l'APK"; exit 1; }
              # « Signer #1 certificate… » (build-tools 36), « V3.1 Signer: certificate… » (37) : on lit l'empreinte, pas la
              # tournure. Il en faut au moins une, la nouvelle, et AUCUNE qui ne soit ni la nouvelle ni l'ancienne.
              got="$(printf '%s\n' "$out" | sed -n 's/^.*certificate SHA-256 digest: //p' | tr -d ':\r' | tr 'A-F' 'a-f' | sort -u)"
              new="$(printf '%s' "$SIGNING_SHA256" | tr -d ':' | tr 'A-F' 'a-f')"
              old="$(printf '%s' "$SIGNING_ORIGIN_SHA256" | tr -d ':' | tr 'A-F' 'a-f')"
              stranger="$(printf '%s\n' "$got" | grep -vxF -e "$new" -e "$old" || true)"
              chain=0; printf '%s\n' "$out" | grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' && chain=1
              if [ -z "$got" ] || [ -n "$stranger" ] || ! printf '%s\n' "$got" | grep -qxF "$new" || [ "$chain" != 1 ]; then
                echo "apksigner : $apksigner"
                ls -l android/app/build/outputs/apk/release
                printf '%s\n' "$out"
                echo "::error::l'APK n'est pas signe par nos cles avec la chaine de rotation (empreintes lues : ${got:-aucune})"
                exit 1
              fi
              cp "$apk" "free-games-claimer-android-$v.apk"
              ;;
          esac
          sha256sum free-games-claimer-android-*.apk

      # Une commodite (l'APK de chaque push, a telecharger), pas une etape de la release : « Deposer la release » prend l'APK sur le
      # disque du runner. Un envoi refuse (quota d'artefacts atteint, 2026-10-08) ne doit donc pas empecher de publier ; et sept
      # jours suffisent, les versions publiees gardent leur APK dans la release.
      - uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: apk
          path: free-games-claimer-android-*.apk
          retention-days: 7

      - name: Deposer la release
        if: startsWith(github.ref, 'refs/tags/app-v') || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts)"
          tag="app-v$v"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "La release $tag existe deja : rien a publier."
            exit 0
          fi
          apk="free-games-claimer-android-$v.apk"
          if [ ! -f "$apk" ]; then
            echo "::error::pas d'APK signe par la bonne cle : rien n'est publie"
            exit 1
          fi
          sha="$(sha256sum "$apk" | cut -d' ' -f1)"
          {
            echo "L'appli Android $v, signee : a ouvrir sur le telephone (autoriser l'installation depuis cette source la premiere fois). Elle s'installe par-dessus la version precedente sans rien perdre."
            echo
            echo "Installation, Play Protect, mise a jour : android/README.md. Nouveautes : CHANGELOG.md."
            echo
            echo "- SHA-256 de l'APK : \`$sha\`"
            echo "- Certificat de signature (SHA-256) : \`$SIGNING_SHA256\` (nouvelle cle, par rotation depuis \`$SIGNING_ORIGIN_SHA256\`)"
          } > notes.md
          gh release create "$tag" --target "$GITHUB_SHA" --title "Appli Android $v" --notes-file notes.md "$apk"
