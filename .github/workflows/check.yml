# Ce que la relecture d'un diff ne voit pas.
#
# `npm run check` fait trois choses, et la premiere est la seule qui compte
# ici : elle reconstruit le moteur a partir de src/core et compare le SHA256 au
# temoin fige de build/references/reference.json. Une divergence involontaire est
# invisible a l'oeil nu -- d'ou ce workflow.
#
# Aucune dependance a installer : package.json n'en declare aucune, il n'y a
# donc ni lockfile ni `npm ci`. Node 22, la version sur laquelle le projet est
# developpe ; `node --test "test/*.test.mjs"` demande que Node developpe le
# motif lui-meme, ce qu'il ne fait qu'a partir de la 21.
name: check

# Sur toutes les branches, et pas sur les pull requests : elles vivent dans ce
# depot, la branche est donc deja passee au check. Deux fois le meme travail
# n'apprend rien.
on:
  push:
    branches: ['**']
  workflow_dispatch:

# Lire le depot, rien de plus. Le jeton par defaut peut etre en ecriture selon
# les reglages du depot ; un controle n'a aucune raison de pouvoir pousser.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check

      # La sonnette (2.54.0). Un push sur main dont le check passe previent le
      # PC de l'auteur, qui fait aussitot son `git pull` (tools/maj-auto.ps1,
      # l'ecouteur). Le sujet ntfy est un secret du depot, MAJ_NTFY : absent,
      # l'etape ne fait rien. Le message ne porte que le numero du commit --
      # l'ecouteur n'en lit meme pas le contenu. Une panne de ntfy ne rend pas
      # le check rouge : la mise a jour horaire rattrapera.
      - name: Sonnette de mise a jour
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          MAJ_NTFY: ${{ secrets.MAJ_NTFY }}
        run: |
          if [ -z "$MAJ_NTFY" ]; then echo "pas de secret MAJ_NTFY : aucune sonnette"; exit 0; fi
          case "$MAJ_NTFY" in https://*) ;; *) echo "MAJ_NTFY doit commencer par https://"; exit 0 ;; esac
          curl -fsS -m 20 -H "Title: Free Games Auto-Claimer" -d "${GITHUB_SHA::7}" "$MAJ_NTFY" -o /dev/null \
            && echo "sonnette envoyee" || echo "ntfy injoignable : la mise a jour horaire rattrapera"
