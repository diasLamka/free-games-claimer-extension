cts Smooth Curve or Wavy / Humps.</span></p></li><li><p><span><strong>Num Mid Points</strong> adjusts the curve profile or wave count. It is not the final path-point count.</span></p></li><li><p><span><strong>Lane Offset</strong> changes lateral spacing around turns and maneuvers. The available NavMesh constrains the result.</span></p></li></ul><p><br><span>Return these values through <strong>APS_MoveToInterface</strong> on the moving Pawn or XAI actor. Change them for patrol, pursuit, or other AI states; the next path request uses the current settings.</span></p><p><br><span><strong>Additional features</strong></span><br></p><ul><li><p><span>Select Unreal’s default Recast search, APS Low-Level Tiles, or APS Low-Level Tiles + Arc on <strong>APS_NavigationData</strong>.</span></p></li></ul><ul><li><p><span><strong>Find Custom Path</strong> accepts your own world-space route. Your code handles its validation.</span></p></li><li><p><span>Inspect generated routes with path lines, points, navigation logs and the runtime overlay.</span></p></li></ul><p><br><span>APS provides corridor options for Unreal’s <strong>Detour Crowd</strong>. Use <strong>APS_AIController</strong> when Crowd agents need to follow curved path points more closely. For <strong>XAI</strong>, select APS_NavigationData and use XAI’s navigation-based <strong>MoveTo</strong>.</span></p><p><br><span><strong>Setup and examples</strong></span></p><p><br><span>Your level needs a working NavMesh and an agent with navigation-based movement. Select <strong>APS_NavigationData</strong> for the agent and set the Character Movement component’s <strong>Preferred Nav Data</strong> to APS_NavigationData.</span></p><p><br><span>The documentation includes setup screenshots, node diagrams, interactive Arc and Lane Offset previews, and five Blueprint examples: random arc initialization, timer-based rerouting, waypoint patrols, AI-state profiles and custom routes.</span></p><p><br><a target=\"_blank\" href=\"https://nordvad
